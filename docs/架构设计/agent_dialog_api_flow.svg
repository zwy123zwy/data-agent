<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1180" viewBox="0 0 1680 1180">
  <defs>
    <style>
      .bg { fill: #f7f9fc; }
      .title { font: 700 34px "Microsoft YaHei", "PingFang SC", Arial, sans-serif; fill: #172033; }
      .sub { font: 18px "Microsoft YaHei", "PingFang SC", Arial, sans-serif; fill: #526071; }
      .lane-title { font: 700 20px "Microsoft YaHei", "PingFang SC", Arial, sans-serif; fill: #21314d; }
      .box-title { font: 700 18px "Microsoft YaHei", "PingFang SC", Arial, sans-serif; fill: #172033; }
      .box-text { font: 15px "Microsoft YaHei", "PingFang SC", Arial, sans-serif; fill: #3f4b5f; }
      .small { font: 13px "Microsoft YaHei", "PingFang SC", Arial, sans-serif; fill: #526071; }
      .path { font: 700 15px Consolas, "Microsoft YaHei", monospace; fill: #0f5e83; }
      .note { font: 14px "Microsoft YaHei", "PingFang SC", Arial, sans-serif; fill: #6b4b00; }
      .lane { fill: #ffffff; stroke: #d9e2ef; stroke-width: 1.5; rx: 14; }
      .api { fill: #e5f5ff; stroke: #79bde0; stroke-width: 2; rx: 12; }
      .service { fill: #eef8ef; stroke: #83c987; stroke-width: 2; rx: 12; }
      .graph { fill: #fff4df; stroke: #e2b55f; stroke-width: 2; rx: 12; }
      .decision { fill: #fff; stroke: #d19600; stroke-width: 2; }
      .terminal { fill: #f1f3f6; stroke: #aab5c4; stroke-width: 2; rx: 20; }
      .error { fill: #ffecec; stroke: #d96d6d; stroke-width: 2; rx: 12; }
      .arrow { stroke: #66758a; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .arrow-strong { stroke: #0f5e83; stroke-width: 2.8; fill: none; marker-end: url(#arrow-blue); }
      .arrow-warn { stroke: #b37b00; stroke-width: 2.4; fill: none; marker-end: url(#arrow-warn); }
      .label { font: 14px "Microsoft YaHei", "PingFang SC", Arial, sans-serif; fill: #314059; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#66758a"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#0f5e83"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#b37b00"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1680" height="1180"/>
  <text class="title" x="60" y="58">python-agent-v2 智能体对话接口路径与数据执行流程</text>
  <text class="sub" x="60" y="88">来源：app/main.py、app/api/chat_controller.py、app/api/graph_controller.py、app/api/streaming_graph_controller.py、app/workflows/graph.py</text>

  <rect class="lane" x="40" y="120" width="380" height="980"/>
  <text class="lane-title" x="70" y="155">1. 对话相关 API 入口</text>

  <rect class="api" x="70" y="185" width="320" height="120"/>
  <text class="box-title" x="92" y="215">会话管理</text>
  <text class="path" x="92" y="242">GET /api/agent/{agentId}/sessions</text>
  <text class="path" x="92" y="266">POST /api/agent/{agentId}/sessions</text>
  <text class="path" x="92" y="290">DELETE /api/agent/{agentId}/sessions</text>

  <rect class="api" x="70" y="330" width="320" height="145"/>
  <text class="box-title" x="92" y="360">消息与标题</text>
  <text class="path" x="92" y="387">GET /api/sessions/{sessionId}/messages</text>
  <text class="path" x="92" y="411">POST /api/sessions/{sessionId}/messages</text>
  <text class="small" x="92" y="438">titleNeeded=true 且 role=user</text>
  <text class="small" x="92" y="459">异步生成会话标题</text>

  <rect class="api" x="70" y="500" width="320" height="130"/>
  <text class="box-title" x="92" y="530">会话事件与报告</text>
  <text class="path" x="92" y="557">GET /api/agent/{agentId}/sessions/stream</text>
  <text class="path" x="92" y="581">POST /api/sessions/{sessionId}/reports/html</text>
  <text class="small" x="92" y="608">仅推送会话事件或导出 HTML，不执行图工作流</text>

  <rect class="api" x="70" y="675" width="320" height="170"/>
  <text class="box-title" x="92" y="705">智能体分析核心入口</text>
  <text class="path" x="92" y="732">POST /api/query</text>
  <text class="small" x="92" y="754">同步：compiled_workflow.ainvoke()</text>
  <text class="path" x="92" y="786">POST /api/query/stream</text>
  <text class="small" x="92" y="808">SSE：JSON body</text>
  <text class="path" x="92" y="840">GET /api/stream/search</text>
  <text class="small" x="92" y="862">SSE：兼容 Java 查询参数</text>

  <rect class="lane" x="460" y="120" width="480" height="980"/>
  <text class="lane-title" x="490" y="155">2. 接口预处理与状态构建</text>

  <rect class="service" x="500" y="190" width="380" height="120"/>
  <text class="box-title" x="525" y="220">FastAPI 注册路由</text>
  <text class="box-text" x="525" y="248">app/main.py include_router()</text>
  <text class="box-text" x="525" y="273">graph_controller、streaming_graph_controller</text>
  <text class="box-text" x="525" y="296">chat_controller</text>

  <rect class="service" x="500" y="350" width="380" height="145"/>
  <text class="box-title" x="525" y="380">核心请求参数</text>
  <text class="box-text" x="525" y="408">agentId、query、workflowId</text>
  <text class="box-text" x="525" y="432">humanFeedback、humanFeedbackContent</text>
  <text class="box-text" x="525" y="456">rejectedPlan、nl2sqlOnly</text>
  <text class="small" x="525" y="480">QueryRequest 使用 camelCase alias</text>

  <rect class="service" x="500" y="535" width="380" height="155"/>
  <text class="box-title" x="525" y="565">流式接口前置校验</text>
  <text class="box-text" x="525" y="594">1. AgentService.get_agent()</text>
  <text class="box-text" x="525" y="620">2. AgentDatasourceService.list_agent_datasources()</text>
  <text class="box-text" x="525" y="646">3. 找 active datasource</text>
  <text class="box-text" x="525" y="672">4. 按 select_tables 注入 semantic_model_prompt</text>

  <rect class="error" x="500" y="730" width="380" height="115"/>
  <text class="box-title" x="525" y="760">预处理失败条件</text>
  <text class="box-text" x="525" y="790">Agent 不存在 → SSE error 后结束</text>
  <text class="box-text" x="525" y="816">没有激活数据源 → SSE error 后结束</text>

  <rect class="service" x="500" y="885" width="380" height="130"/>
  <text class="box-title" x="525" y="915">构造 WorkflowState / Resume</text>
  <text class="box-text" x="525" y="944">普通请求 → initial_state</text>
  <text class="box-text" x="525" y="970">带 workflowId + feedbackContent</text>
  <text class="box-text" x="525" y="996">→ Command(resume={approve/reject, reason})</text>

  <rect class="lane" x="980" y="120" width="650" height="980"/>
  <text class="lane-title" x="1010" y="155">3. LangGraph 条件执行流程</text>

  <rect class="graph" x="1035" y="185" width="220" height="68"/>
  <text class="box-title" x="1060" y="216">IntentRecognition</text>
  <text class="small" x="1060" y="239">识别 data_analysis / chitchat</text>

  <polygon class="decision" points="1365,185 1485,219 1365,253 1245,219"/>
  <text class="box-title" x="1317" y="215">intent?</text>
  <text class="small" x="1328" y="237">data_analysis</text>

  <rect class="terminal" x="1500" y="185" width="95" height="68"/>
  <text class="box-title" x="1532" y="216">END</text>
  <text class="small" x="1524" y="239">闲聊结束</text>

  <rect class="graph" x="1035" y="300" width="220" height="68"/>
  <text class="box-title" x="1060" y="330">KnowledgeRecall</text>
  <text class="small" x="1060" y="353">召回业务知识</text>

  <rect class="graph" x="1035" y="405" width="220" height="68"/>
  <text class="box-title" x="1060" y="435">QueryRewrite</text>
  <text class="small" x="1060" y="458">无 rewritten_query → END</text>

  <rect class="graph" x="1035" y="510" width="220" height="68"/>
  <text class="box-title" x="1060" y="540">SchemaRecall</text>
  <text class="small" x="1060" y="563">无 schema → END</text>

  <rect class="graph" x="1035" y="615" width="220" height="80"/>
  <text class="box-title" x="1060" y="645">TableRelation</text>
  <text class="small" x="1060" y="668">异常且 retry&lt;3 → 自重试</text>
  <text class="small" x="1060" y="688">超过 3 次 → END</text>

  <rect class="graph" x="1035" y="740" width="220" height="75"/>
  <text class="box-title" x="1060" y="770">Feasibility</text>
  <text class="small" x="1060" y="793">feasible=false → END</text>

  <rect class="graph" x="1035" y="860" width="220" height="68"/>
  <text class="box-title" x="1060" y="890">Planner</text>
  <text class="small" x="1060" y="913">生成 execution_plan</text>

  <rect class="graph" x="1335" y="860" width="230" height="90"/>
  <text class="box-title" x="1360" y="890">PlanExecutor</text>
  <text class="small" x="1360" y="914">校验计划并按当前 step 调度</text>
  <text class="small" x="1360" y="936">失败修复 &lt;=3 次回 Planner</text>

  <rect class="graph" x="1335" y="535" width="230" height="68"/>
  <text class="box-title" x="1360" y="565">SQL 流水线</text>
  <text class="small" x="1360" y="588">sql_generate → semantic_check → sql_execute</text>

  <rect class="graph" x="1335" y="640" width="230" height="80"/>
  <text class="box-title" x="1360" y="670">Python 流水线</text>
  <text class="small" x="1360" y="693">python_generate → execute</text>
  <text class="small" x="1360" y="713">成功或重试耗尽 → analyze</text>

  <rect class="graph" x="1335" y="300" width="230" height="75"/>
  <text class="box-title" x="1360" y="330">HumanFeedback</text>
  <text class="small" x="1360" y="353">humanFeedback=true 且非 nl2sqlOnly</text>
  <text class="small" x="1360" y="373">approve 继续 / reject 重规划</text>

  <rect class="graph" x="1335" y="430" width="230" height="68"/>
  <text class="box-title" x="1360" y="460">ReportGenerator</text>
  <text class="small" x="1360" y="483">生成最终 report/html_report</text>

  <rect class="terminal" x="1470" y="1025" width="95" height="58"/>
  <text class="box-title" x="1502" y="1058">END</text>

  <path class="arrow-strong" d="M390 760 C440 760 450 250 500 250"/>
  <path class="arrow-strong" d="M880 950 C950 950 965 220 1035 220"/>
  <path class="arrow" d="M1255 219 L1245 219"/>
  <path class="arrow" d="M1485 219 L1500 219"/>
  <text class="label" x="1488" y="205">chitchat</text>
  <path class="arrow" d="M1365 253 C1365 282 1265 284 1255 318"/>
  <path class="arrow" d="M1145 253 L1145 300"/>
  <path class="arrow" d="M1145 368 L1145 405"/>
  <path class="arrow" d="M1145 473 L1145 510"/>
  <path class="arrow" d="M1145 578 L1145 615"/>
  <path class="arrow" d="M1145 695 L1145 740"/>
  <path class="arrow" d="M1145 815 L1145 860"/>
  <path class="arrow" d="M1255 894 L1335 905"/>

  <path class="arrow-warn" d="M1335 905 C1268 910 1268 890 1255 890"/>
  <text class="label" x="1268" y="850">计划校验失败且未超限</text>

  <path class="arrow" d="M1450 860 C1450 780 1450 710 1450 720"/>
  <path class="arrow" d="M1450 860 C1450 760 1450 602 1450 603"/>
  <path class="arrow" d="M1450 860 C1450 700 1450 376 1450 375"/>
  <path class="arrow" d="M1450 860 C1450 710 1450 500 1450 498"/>
  <text class="label" x="1515" y="820">按 plan_next_node 分支</text>

  <path class="arrow" d="M1335 569 C1285 569 1285 905 1335 905"/>
  <text class="label" x="1255" y="570">SQL 成功或重试后回调度</text>
  <path class="arrow-warn" d="M1565 569 C1605 569 1605 535 1565 535"/>
  <text class="label" x="1512" y="526">SQL 生成/语义/执行失败可重试</text>

  <path class="arrow" d="M1335 680 C1290 680 1290 905 1335 905"/>
  <text class="label" x="1250" y="710">Python analyze 后回调度</text>
  <path class="arrow-warn" d="M1565 680 C1605 680 1605 640 1565 640"/>
  <text class="label" x="1512" y="632">执行失败且未超限重试</text>

  <path class="arrow" d="M1450 375 C1450 520 1450 770 1450 860"/>
  <text class="label" x="1470" y="398">approve</text>
  <path class="arrow-warn" d="M1335 337 C1270 337 1270 860 1255 890"/>
  <text class="label" x="1260" y="330">reject 且未超 3 次</text>

  <path class="arrow" d="M1450 498 C1450 600 1495 935 1517 1025"/>
  <path class="arrow" d="M1565 905 C1605 905 1605 1054 1565 1054"/>
  <text class="label" x="1488" y="1012">全部 step 完成</text>

  <rect class="graph" x="500" y="1035" width="1065" height="45"/>
  <text class="note" x="525" y="1063">同步接口返回 QueryResponse JSON；流式接口把每个节点输出转换为 SSE 事件：start、intent、knowledge、rewrite、schema、table_relation、feasibility、plan、plan_step、sql、semantic_check、sql_result/sql_error、python_code、python_execute、python_analysis、report、paused、done、error。</text>
</svg>
